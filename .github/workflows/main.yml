name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android --project-name daily_islamic_routine build_app
          cp pubspec.yaml build_app/pubspec.yaml
          cp lib/main.dart build_app/lib/main.dart

      - name: Get packages
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-islamic-routine-apk
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
